# Trivy accepted-risk list — used by every Trivy scan in pipelines/pr-validation.yml
# (--ignorefile .trivyignore.yaml).
#
# Rules for entries:
#   - scope them with `paths` where possible
#   - always give a `statement` (why + follow-up) and an `expired_at` date;
#     after that date the finding blocks PRs again.

vulnerabilities:
  # starlette 0.38.6 is pinned by fastapi==0.115.0. The fix needs starlette
  # >=1.3.1, i.e. a FastAPI 0.115 -> 0.142 upgrade (separate change).
  - id: CVE-2024-47874
    statement: starlette — fixed by the FastAPI/starlette upgrade
    expired_at: 2026-11-05
  - id: CVE-2026-48818
    statement: starlette — fixed by the FastAPI/starlette upgrade
    expired_at: 2026-11-05
  - id: CVE-2026-54283
    statement: starlette — fixed by the FastAPI/starlette upgrade
    expired_at: 2026-11-05

misconfigurations:
  # NSG: 80/443 must be public (web app + Let's Encrypt HTTP-01). 22 and 6443
  # are open to * until the planned NSG lockdown (restrict to agent/admin IPs).
  # After the lockdown, keep a permanent, narrower entry for 80/443 only.
  - id: AZU-0047
    paths:
      - "infrastructure/terraform/modules/vm/main.tf"
    statement: Public NSG rules — pending NSG lockdown for 22/6443; 80/443 intentional
    expired_at: 2026-11-05
  - id: AZU-0050
    paths:
      - "infrastructure/terraform/modules/vm/main.tf"
    statement: SSH open to * — pending NSG lockdown
    expired_at: 2026-11-05

  # ESO on the k3s VM reaches Key Vault over its public endpoint (RBAC + UAMI).
  # Follow-up: network ACL allowing only the VM's public IP / a private endpoint.
  - id: AZU-0013
    paths:
      - "infrastructure/terraform/modules/keyvault/main.tf"
    statement: Key Vault without network ACL — pending network restriction
    expired_at: 2026-11-05

  # Pod hardening (securityContext / readOnlyRootFilesystem) for the app charts.
  # Needs per-image work (nginx + runtime config.js and Postgres write to disk).
  - id: KSV-0014
    paths:
      - "pipelines/charts/backend/templates/deployment.yaml"
      - "pipelines/charts/frontend/templates/deployment.yaml"
      - "pipelines/charts/timescaledb/templates/statefulset.yaml"
    statement: readOnlyRootFilesystem not set — pending chart hardening
    expired_at: 2026-11-05
  - id: KSV-0118
    paths:
      - "pipelines/charts/backend/templates/deployment.yaml"
      - "pipelines/charts/frontend/templates/deployment.yaml"
      - "pipelines/charts/timescaledb/templates/statefulset.yaml"
    statement: default securityContext — pending chart hardening
    expired_at: 2026-11-05

  # Frontend image runs nginx as root. Fix: nginxinc/nginx-unprivileged (port
  # 8080) + chart/service port and runtime-config path changes.
  - id: DS-0002
    paths:
      - "farmapp-frontend/Dockerfile"
    statement: nginx runs as root — pending switch to nginx-unprivileged
    expired_at: 2026-11-05
