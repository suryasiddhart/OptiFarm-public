# ─────────────────────────────────────────────
# Ansible Configuration — FarmApp k3s Installation
# ─────────────────────────────────────────────
# Used by the Azure DevOps pipeline to install k3s, Helm, and
# nginx ingress controller on Azure VMs via SSH.
# ─────────────────────────────────────────────

[defaults]
# Disable host key checking — VMs are provisioned dynamically,
# so host keys change on every deployment.
host_key_checking = False

# SSH timeout (seconds)
timeout = 30

# Number of parallel forks (single VM, but keep default)
forks = 5

# Do not retry failed SSH connections
retries = 1

# Use the SSH client backend (more reliable than paramiko)
transport = ssh

# Inventory default location (overridden by pipeline with -i)
inventory = ../inventory/hosts.ini

# Roles path (for future role-based expansion)
roles_path = ../roles

# Output formatting
stdout_callback = default
callbacks_enabled = profile_tasks

# Fact gathering — minimal, we don't need full system facts
gathering = smart
fact_caching = memory

# Error handling
any_errors_fatal = True