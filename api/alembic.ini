# Alembic configuration — FarmApp database migrations
#
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL
# through config.settings (K8s secret "optifarm-secrets" or the local .env).
#
# Usage (from the api/ directory):
#   alembic upgrade head            # apply all migrations
#   alembic revision -m "add xyz"   # create a new migration
#   alembic downgrade -1            # roll back one migration

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
