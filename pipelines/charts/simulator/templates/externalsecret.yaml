{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: simulator-passkeys
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "simulator.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: simulator-passkeys
    creationPolicy: Owner
  data:
    {{- range $i, $d := .Values.devices }}
    - secretKey: passkey-{{ $i }}
      remoteRef:
        key: {{ default (printf "simulator-%s-%s" $d.deviceid $.Values.environment) $d.passkeySecret }}
    {{- end }}
{{- end }}
