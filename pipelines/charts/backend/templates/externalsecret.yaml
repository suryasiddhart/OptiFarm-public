{{- if .Values.externalSecret.enabled }}
# Syncs backend secrets from Azure Key Vault (via the ESO ClusterSecretStore)
# into the "optifarm-secrets" K8s Secret referenced by the deployment env:
#   database-url — composed from the same Postgres credentials TimescaleDB uses
#   secret-key   — JWT signing key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: optifarm-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: optifarm-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        database-url: "postgresql://{{ `{{ .dbUser }}` }}:{{ `{{ .dbPassword }}` }}@{{ default (printf "timescaledb.%s.svc.cluster.local" .Values.namespace) .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
        secret-key: "{{ `{{ .jwtSecretKey }}` }}"
  data:
    - secretKey: dbUser
      remoteRef:
        key: postgres-user-{{ .Values.environment }}
    - secretKey: dbPassword
      remoteRef:
        key: postgres-password-{{ .Values.environment }}
    - secretKey: jwtSecretKey
      remoteRef:
        key: jwt-secret-key-{{ .Values.environment }}
{{- end }}
