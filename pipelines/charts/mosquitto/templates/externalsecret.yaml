{{- if .Values.externalSecret.enabled }}
# MQTT system-client passwords from Azure Key Vault:
#   admin-password  — dynsec admin (the API pushes device credentials with it)
#   bridge-password — MQTT → Kafka bridge (read-only on device telemetry)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mqtt-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: mqtt-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: mqtt-admin-password-{{ .Values.environment }}
    - secretKey: bridge-password
      remoteRef:
        key: mqtt-bridge-password-{{ .Values.environment }}
{{- end }}
