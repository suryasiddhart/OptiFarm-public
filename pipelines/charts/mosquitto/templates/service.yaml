apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: mqtt
  type: ClusterIP
{{- if .Values.external.enabled }}
---
# Device entry point: k3s ServiceLB binds the port on the node.
#   TLS on  (Azure VM): 8883, opened in the NSG by infrastructure/terraform/modules/vm
#   TLS off (local machine only): plain 1883
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-external
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  selector:
    app: mosquitto
  ports:
    {{- if .Values.tls.enabled }}
    - name: mqtts
      protocol: TCP
      port: 8883
      targetPort: mqtts
    {{- else }}
    - name: mqtt
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: mqtt
    {{- end }}
  type: LoadBalancer
{{- end }}
