# Creates the telemetry topics after every install/upgrade (--if-not-exists);
# existing topics keep their data and partition count.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kafka-topics
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: create-topics
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              BOOTSTRAP="kafka.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.service.port }}"
              K=/opt/kafka/bin/kafka-topics.sh
              {{- range .Values.topics }}
              $K --bootstrap-server "$BOOTSTRAP" --create --if-not-exists \
                --topic {{ .name }} --partitions {{ .partitions }} --replication-factor 1 \
                --config retention.ms={{ .retentionMs | int64 }}
              {{- end }}
              $K --bootstrap-server "$BOOTSTRAP" --describe
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /opt/kafka/logs
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
