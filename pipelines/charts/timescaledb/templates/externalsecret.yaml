{{- if .Values.externalSecret.enabled }}
# Syncs Postgres credentials from Azure Key Vault (via the ESO
# ClusterSecretStore) into the "timescale-db-secret" K8s Secret
# consumed by the StatefulSet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: timescale-db-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "timescaledb.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: timescale-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        postgres-user: "{{ `{{ .user }}` }}"
        postgres-password: "{{ `{{ .password }}` }}"
        postgres-db: {{ .Values.db.name | quote }}
  data:
    - secretKey: user
      remoteRef:
        key: postgres-user-{{ .Values.environment }}
    - secretKey: password
      remoteRef:
        key: postgres-password-{{ .Values.environment }}
{{- end }}
