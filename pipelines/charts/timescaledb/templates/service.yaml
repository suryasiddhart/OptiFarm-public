apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "timescaledb.labels" . | nindent 4 }}
spec:
  selector:
    app: timescaledb
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  type: {{ .Values.service.type }}
