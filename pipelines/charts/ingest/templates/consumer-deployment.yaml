# Kafka → TimescaleDB (appschema.moisturedata), offsets committed after the DB commit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-consumer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ingest.labels" . | nindent 4 }}
    component: ingest-consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app: ingest
      component: ingest-consumer
  template:
    metadata:
      labels:
        app: ingest
        component: ingest-consumer
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "consumer.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.name }}
                  key: {{ .Values.secrets.database.key }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_TELEMETRY_TOPIC
              value: {{ .Values.kafka.telemetryTopic | quote }}
            - name: KAFKA_DLQ_TOPIC
              value: {{ .Values.kafka.dlqTopic | quote }}
            - name: BATCH_MAX_MESSAGES
              value: {{ .Values.consumer.batchMaxMessages | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
