  # ─────────────────────────────────────────────────────────
  # STAGE 2: Frontend
  # ─────────────────────────────────────────────────────────
  - stage: Frontend
    displayName: "Frontend — Lint, Types, Tests & Build"
    dependsOn: []
    jobs:
      - job: FrontendChecks
        displayName: "ESLint, TypeScript, Vitest & Build"
        container: node
        variables:
          npm_config_cache: $(npmCacheDir)
        steps:
          - checkout: self
          - task: Cache@2
            displayName: "Cache npm downloads"
            inputs:
              key: 'npm | "$(Agent.OS)" | farmapp-frontend/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npmCacheDir)
          - script: npm ci --no-audit --no-fund
            workingDirectory: farmapp-frontend
            displayName: "Install dependencies (npm ci)"
          - script: npm run lint
            workingDirectory: farmapp-frontend
            displayName: "ESLint"
          - script: npm run typecheck
            workingDirectory: farmapp-frontend
            displayName: "TypeScript type check (tsc -b)"
          - script: ./scripts/run-unit-tests.sh
            workingDirectory: farmapp-frontend
            displayName: "Run frontend unit tests (Vitest)"
          - task: PublishTestResults@2
            displayName: "Publish frontend test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "farmapp-frontend/test-results/unit-*.xml"
              testRunTitle: "Frontend Unit Tests"
              failTaskOnFailedTests: true
          - publish: farmapp-frontend/coverage
            artifact: coverage-frontend
            displayName: "Publish coverage artifact"
            condition: succeededOrFailed()
          - script: npm run build
            workingDirectory: farmapp-frontend
            displayName: "Production build (vite build)"

  # ─────────────────────────────────────────────────────────
  # STAGE 3: Images — build + vulnerability scan
  # ─────────────────────────────────────────────────────────
  - stage: Images
    displayName: "Docker Build & Image Scan"
    dependsOn: []
    jobs:
      - job: BuildAndScan
        displayName: "Build & Trivy scan images"
        variables:
          apiImage: "optifarm-api:pr-$(Build.BuildId)"
          frontendImage: "optifarm-frontend:pr-$(Build.BuildId)"
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              docker build -t "$(apiImage)" api/
              docker build -t "$(frontendImage)" farmapp-frontend/
            displayName: "Build images"
          - script: |
              set -euo pipefail
              for image in "$(apiImage)" "$(frontendImage)"; do
                echo "→ Scanning ${image}"
                docker run --rm \
                  -v /var/run/docker.sock:/var/run/docker.sock \
                  -v "$(Build.SourcesDirectory):/src:ro" -w /src \
                  -v trivy-cache:/root/.cache \
                  "$(trivyImage)" image \
                  --severity HIGH,CRITICAL --ignore-unfixed \
                  --ignorefile .trivyignore.yaml \
                  --exit-code 1 "${image}"
              done
            displayName: "Trivy image scan (HIGH/CRITICAL, fixable)"
          - script: docker image rm -f "$(apiImage)" "$(frontendImage)" || true
            displayName: "Remove PR images"
            condition: always()

  # ─────────────────────────────────────────────────────────
  # STAGE 4: Security — secrets, SAST, dependencies, IaC
  # ─────────────────────────────────────────────────────────
  - stage: Security
    displayName: "Security Scanning"
    dependsOn: []
    jobs:
      - job: SecretScan
        displayName: "Secret scan (Gitleaks)"
        steps:
          - checkout: self
            fetchDepth: 0
          - script: |
              set -euo pipefail
              TARGET_BRANCH="$(System.PullRequest.TargetBranch)"
              LOG_OPTS=""
              # In PR builds scan only the PR's commits; otherwise full history
              if [[ "$TARGET_BRANCH" == refs/heads/* ]]; then
                LOG_OPTS="--log-opts=origin/${TARGET_BRANCH#refs/heads/}..HEAD"
                echo "→ Scanning commits in origin/${TARGET_BRANCH#refs/heads/}..HEAD"
              else
                echo "→ Not a PR build: scanning full history"
              fi
              docker run --rm -v "$(Build.SourcesDirectory):/repo" \
                "$(gitleaksImage)" git /repo \
                --config /repo/.gitleaks.toml --redact --no-banner ${LOG_OPTS}
            displayName: "Gitleaks (git history)"

      - job: SAST
        displayName: "SAST (Semgrep)"
        steps:
          - checkout: self
          - script: |
              docker run --rm -v "$(Build.SourcesDirectory):/src" -w /src \
                "$(semgrepImage)" semgrep scan \
                --config p/python --config p/typescript --config p/react --config p/dockerfile \
                --severity ERROR --error --metrics=off \
                --exclude node_modules --exclude .terraform
            displayName: "Semgrep (ERROR severity blocks)"

      - job: DependencyAndIaC
        displayName: "Dependency & IaC scan (Trivy)"
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              TRIVY="docker run --rm -v $(Build.SourcesDirectory):/src:ro -w /src -v trivy-cache:/root/.cache $(trivyImage)"
              for target in api farmapp-frontend; do
                echo "→ Dependencies: ${target}"
                $TRIVY fs --scanners vuln \
                  --severity HIGH,CRITICAL --ignore-unfixed \
                  --ignorefile .trivyignore.yaml \
                  --skip-dirs "**/node_modules" \
                  --exit-code 1 "${target}"
              done
            displayName: "Trivy dependency scan (requirements.txt, package-lock.json)"
          - script: |
              set -euo pipefail
              docker run --rm -v "$(Build.SourcesDirectory):/src:ro" -w /src \
                -v trivy-cache:/root/.cache "$(trivyImage)" config \
                --severity HIGH,CRITICAL \
                --ignorefile .trivyignore.yaml \
                --skip-dirs "**/node_modules" --skip-dirs "**/.terraform" \
                --exit-code 1 .
            displayName: "Trivy IaC scan (Helm, Terraform, Dockerfiles)"

  # ─────────────────────────────────────────────────────────
  # STAGE 5: Deployment manifests
  # ─────────────────────────────────────────────────────────
  - stage: Manifests
    displayName: "Helm Charts & Manifests"
    dependsOn: []
    jobs:
      - job: HelmAndIngress
        displayName: "helm lint/template & ingress render"
        container: python
        steps:
          - checkout: self
          - task: HelmInstaller@1
            displayName: "Install Helm"
            inputs:
              helmVersionToInstall: latest
          - script: |
              set -euo pipefail
              for chart in timescaledb backend frontend; do
                echo "→ ${chart}"
                helm lint "pipelines/charts/${chart}" \
                  --set environment=staging,namespace=optifarm-staging
                helm template "${chart}" "pipelines/charts/${chart}" \
                  --set environment=staging,namespace=optifarm-staging > /dev/null
              done
            displayName: "helm lint & template"
          # Same substitution the deploy pipeline does with envsubst

  # ─────────────────────────────────────────────────────────
  # STAGE 6: Coverage report (merged)
  # ─────────────────────────────────────────────────────────
  - stage: Report
    displayName: "Code Coverage"
    dependsOn:
      - Backend
      - Frontend
    condition: succeededOrFailed()
    jobs:
      - job: Coverage
        displayName: "Publish merged coverage"
        steps:
          - checkout: self
          - download: current
            patterns: "coverage-*/**"
            displayName: "Download coverage artifacts"
          - task: PublishCodeCoverageResults@2
            displayName: "Publish code coverage"
            inputs:
              # coverage.xml, coverage-integration.xml, cobertura-coverage.xml
              summaryFileLocation: "$(Pipeline.Workspace)/coverage-*/*.xml"
              pathToSources: $(Build.SourcesDirectory)

  # ─────────────────────────────────────────────────────────
  # STAGE 7: SonarQube quality gate (disabled until a server exists)
  # ─────────────────────────────────────────────────────────
  # Enable by setting the enableSonar parameter default to true once the
  # "farmapp-sonarqube" service connection is configured.
  - ${{ if eq(parameters.enableSonar, true) }}:
      - stage: QualityGate
        displayName: "SonarQube Quality Gate"
        dependsOn:
          - Backend
          - Frontend
        jobs:
          - job: SonarQube
            displayName: "SonarQube analysis"
            steps:
              - checkout: self
                fetchDepth: 0
              - download: current
                patterns: "coverage-*/**"
                displayName: "Download coverage artifacts"
              - task: SonarQubePrepare@7
                displayName: "Prepare SonarQube analysis"
                inputs:
                  SonarQube: "farmapp-sonarqube"
                  scannerMode: cli
                  configMode: manual
                  cliProjectKey: farmapp
                  cliProjectName: FarmApp
                  cliSources: "."
                  extraProperties: |
                    sonar.sources=api,farmapp-frontend/src
                    sonar.tests=api/tests,farmapp-frontend/tests
                    sonar.exclusions=api/migrations/**,api/tests/**
                    sonar.python.version=3.12
                    sonar.python.coverage.reportPaths=$(Pipeline.Workspace)/coverage-backend-unit/coverage.xml,$(Pipeline.Workspace)/coverage-backend-integration/coverage-integration.xml
                    sonar.javascript.lcov.reportPaths=$(Pipeline.Workspace)/coverage-frontend/lcov.info
              - task: SonarQubeAnalyze@7
                displayName: "Run SonarQube analysis"
              - task: SonarQubePublish@7
                displayName: "Publish quality gate result"
                inputs:
                  pollingTimeoutSec: "300"
