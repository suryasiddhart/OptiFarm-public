# FarmApp — PR Validation Pipeline
#
# Configured as the Build Validation branch policy for `develop` and `main`.
# Every check here is BLOCKING: the PR can only complete when all stages pass.
# It does NOT deploy anything.
#
# Stages (independent, run in parallel when agents are available):
#   Backend      — compile, Bandit, unit tests, Alembic migration round-trip,
#                  integration tests against TimescaleDB
#   Frontend     — ESLint, TypeScript, Vitest, production build
#   Images       — docker build of both images + Trivy image scan
#   Security     — Gitleaks (PR commits), Semgrep SAST, Trivy dependency and
#                  IaC (Helm/Terraform/Dockerfile) scans
#   Manifests    — helm lint/template for all charts, ingress render check
#   Report       — merged code coverage
#   QualityGate  — SonarQube (only when the enableSonar parameter is true)
#
# ─────────────────────────────────────────────
# Agent requirements (self-hosted pool)
# ─────────────────────────────────────────────
# Linux agent with Docker. Backend/frontend jobs run as container jobs in
# pinned images, and scanners run as pinned Docker images, so no Python/Node
# tool cache or sudo is needed on the agent.
#
# ─────────────────────────────────────────────
# Security scan policy
# ─────────────────────────────────────────────
# HIGH/CRITICAL findings with an available fix fail the PR. Accepted risks go
# in /.trivyignore.yaml (with a statement and an expiry date) — reviewed in
# PRs like any other change.
#
# NOTE: for Azure Repos Git the `pr:` block below is ignored; the branch
# policy decides when this pipeline runs (configure its path filter there).

trigger: none

pr:
  branches:
    include:
      - develop
      - main

parameters:
  - name: enableSonar
    displayName: "Run SonarQube quality gate"
    type: boolean
    default: false

variables:
  trivyImage: aquasec/trivy:0.75.0
  gitleaksImage: zricethezav/gitleaks:v8.30.1
  semgrepImage: semgrep/semgrep:1.179.0
  # Throwaway test database (service container, never reachable outside the job)
  testDatabaseUrl: "postgresql://testuser:testpass@postgres:5432/farmapp_test"
  # Dummy value — only satisfies Settings() validation in tests
  testSecretKey: "ci-only-dummy-secret-key-not-used-for-real-tokens"
  npmCacheDir: $(Pipeline.Workspace)/.npm

resources:
  containers:
    - container: python
      image: python:3.12-slim
    - container: node
      image: node:22-bookworm
    - container: timescaledb
      image: timescale/timescaledb-ha:pg18
      env:
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        POSTGRES_DB: farmapp_test

# Self-hosted pool for all jobs (template expressions aren't allowed here)
pool:
  name: Exp-Agent

stages:
  # ─────────────────────────────────────────────────────────
  # STAGE 1: Backend
  # ─────────────────────────────────────────────────────────
  - stage: Backend
    displayName: "Backend — Lint, Unit, Migrations & Integration"
    dependsOn: []
    jobs:
      - job: BackendUnit
        displayName: "Compile, Bandit & Unit Tests"
        container: python
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              python -m venv "$(Agent.TempDirectory)/venv"
              . "$(Agent.TempDirectory)/venv/bin/activate"
              pip install --quiet --upgrade pip
              pip install --quiet -r api/requirements-dev.txt
            displayName: "Install Python dependencies"
          - script: |
              set -euo pipefail
              . "$(Agent.TempDirectory)/venv/bin/activate"
              cd api
              python -m compileall -q .
              # High-severity issues only; tests/migrations excluded
              bandit -q -r . -x ./tests,./migrations -lll
            displayName: "Compile check & Bandit (Python SAST)"
          - script: |
              set -euo pipefail
              . "$(Agent.TempDirectory)/venv/bin/activate"
              cd api
              ./scripts/run-unit-tests.sh
            displayName: "Run backend unit tests"
          - task: PublishTestResults@2
            displayName: "Publish unit test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "api/test-results/unit-*.xml"
              testRunTitle: "Backend Unit Tests"
              failTaskOnFailedTests: true
          - publish: api/coverage.xml
            artifact: coverage-backend-unit
            displayName: "Publish coverage artifact"
            condition: succeededOrFailed()

