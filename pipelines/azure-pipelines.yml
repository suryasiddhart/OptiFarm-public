# FarmApp — Main CI/CD Pipeline
# Triggered ONLY on merge to develop/main or tag push.
# PR validation is handled by a SEPARATE pipeline (pr-validation.yml)
# configured as a Build Validation policy in Azure Repos branch settings.
#
# This pipeline assumes tests & scans already passed via PR validation.
# It focuses on: Build Docker images → Push to ACR → Helm deploy to k3s.
#
# Field-device ingestion (Kafka, Mosquitto, bridge, consumer) is deployed to
# environments with ingestionEnabled (dev only for now). The device data
# simulator is NOT part of normal runs: queue the pipeline manually with
# "Deploy device data simulator" checked (templates/deploy-simulator.yml).
#
# Deploy stages use templates/deploy-k3s.yml. Required in variable group
# `optifarm-variables`:
#   - key_vault_name — Key Vault holding kubeconfig-<env> (e.g. optifarm-kv1)
# Service connection `terraform-arm-connection` must be able to read
# Key Vault secrets. App secrets are synced in-cluster by ESO.

trigger:
  branches:
    include:
      - develop
      - main
  tags:
    include:
      - v*
  paths:
    include:
      - api/*
      - ingest/*
      - farmapp-frontend/*
      - pipelines/*
      - db/*

pr: none

parameters:
  - name: deploySimulator
    displayName: "Deploy device data simulator"
    type: boolean
    default: false
  - name: simulatorEnvironment
    displayName: "Simulator environment (needs ingestion enabled there)"
    type: string
    default: dev
    values:
      - dev
      - staging

variables:
  - group: optifarm-variables  # Azure Library variable group
  - name: dockerRegistryServiceConnection
    value: "optifarm-acr-connection"
  - name: imageRepositoryBackend
    value: "api"
  - name: imageRepositoryFrontend
    value: "frontend"
  - name: imageRepositoryIngest
    value: "ingest"
  - name: imageRepositorySimulator
    value: "simulator"
  - name: containerRegistry
    value: "acroptifarm.azurecr.io"
  - name: dockerfilePathBackend
    value: "$(Build.SourcesDirectory)/api/Dockerfile"
  - name: dockerfilePathFrontend
    value: "$(Build.SourcesDirectory)/farmapp-frontend/Dockerfile"
  - name: dockerfilePathIngest
    value: "$(Build.SourcesDirectory)/ingest/Dockerfile"
  - name: dockerfilePathSimulator
    value: "$(Build.SourcesDirectory)/simulator/Dockerfile"
  - name: tag
    value: $(Build.BuildId)


stages:
  # ─────────────────────────────────────────────────────────
  # STAGE 1: Build & Push Docker Images
  # ─────────────────────────────────────────────────────────
  - stage: Build
    displayName: "Build & Push Docker Images"
    jobs:
      - job: BuildBackend
        displayName: "Build Backend API Image"
        pool:
          name: Exp-Agent
        steps:
          - checkout: self
   
          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - task: Docker@2
            displayName: "Build & Push Backend"
            inputs:
              command: buildAndPush
              repository: $(imageRepositoryBackend)
              dockerfile: $(dockerfilePathBackend)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

          # - publish: $(Build.ArtifactStagingDirectory)
          #   artifact: manifests
          #   displayName: "Publish Kubernetes manifests"

      - job: BuildFrontend
        displayName: "Build and push Frontend Image"
        pool:
          name: Exp-Agent
        steps:
          - checkout: self

          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - task: Docker@2
            displayName: "Build & Push Frontend"
            inputs:
              command: buildAndPush
              repository: $(imageRepositoryFrontend)
              dockerfile: $(dockerfilePathFrontend)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

      - job: BuildIngest
        displayName: "Build and push Ingest Image (bridge, consumer, dynsec-sync)"
        pool:
          name: Exp-Agent
        steps:
          - checkout: self

          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - task: Docker@2
            displayName: "Build & Push Ingest"
            inputs:
              command: buildAndPush
              repository: $(imageRepositoryIngest)
              dockerfile: $(dockerfilePathIngest)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

      - ${{ if eq(parameters.deploySimulator, true) }}:
          - job: BuildSimulator
            displayName: "Build and push Simulator Image"
            pool:
              name: Exp-Agent
            steps:
              - checkout: self

              - task: Docker@2
                displayName: "Login to ACR"
                inputs:
                  command: login
                  containerRegistry: $(dockerRegistryServiceConnection)

              - task: Docker@2
                displayName: "Build & Push Simulator"
                inputs:
                  command: buildAndPush
                  repository: $(imageRepositorySimulator)
                  dockerfile: $(dockerfilePathSimulator)
                  containerRegistry: $(dockerRegistryServiceConnection)
                  tags: |
                    $(tag)


  # ─────────────────────────────────────────────────────────
  # STAGE 2: Deploy to k3s (dev → staging → prod)
  # ─────────────────────────────────────────────────────────
  - template: templates/deploy-k3s.yml
    parameters:
      stageName: DeployDev
      displayName: "Deploy to Development"
      envName: dev
      environment: "dev"
      ingestionEnabled: true
      # condition: |
      #   and(
      #     succeeded(),
      #     eq(variables['Build.SourceBranch'], 'refs/heads/develop')
      #   )

  - template: templates/deploy-k3s.yml
    parameters:
      stageName: DeployStaging
      displayName: "Deploy to Staging"
      envName: staging
      environment: "staging"
      ingressHostPrefix: "staging."
      ingestionEnabled: false
      condition: |
        and(
          succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/main')
        )

  - template: templates/deploy-k3s.yml
    parameters:
      stageName: DeployProd
      displayName: "Deploy to Production"
      envName: prod
      environment: "prod"
      ingressHostPrefix: "prod."
      ingestionEnabled: false
      apiDocsEnabled: false        # no public Swagger UI / OpenAPI schema in prod
      condition: |
        and(
          succeeded(),
          startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
        )

  # ─────────────────────────────────────────────────────────
  # STAGE 3 (on demand): device data simulator
  # ─────────────────────────────────────────────────────────
  - ${{ if eq(parameters.deploySimulator, true) }}:
      - template: templates/deploy-simulator.yml
        parameters:
          envName: ${{ parameters.simulatorEnvironment }}
          ${{ if eq(parameters.simulatorEnvironment, 'staging') }}:
            dependsOn: DeployStaging
          ${{ else }}:
            dependsOn: DeployDev
