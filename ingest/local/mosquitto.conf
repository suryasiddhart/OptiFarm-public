# Local (docker-compose) broker: plain 1883 only. The Kubernetes chart adds the
# TLS listener (pipelines/charts/mosquitto/templates/configmap.yaml).
per_listener_settings false
allow_anonymous false

# Queued QoS 1 messages for persistent sessions (the bridge) survive restarts
persistence true
persistence_location /mosquitto/data/

# Largest accepted MQTT packet (bytes). Stays under Kafka's 1 MB message limit,
# so the bridge can always forward what the broker accepts.
max_packet_size 900000

# Credentials and ACLs: generated from appschema.devices by ingest/dynsec_sync.py,
# then updated live by the API through $CONTROL/dynamic-security/v1
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/dynsec/dynamic-security.json

listener 1883

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
